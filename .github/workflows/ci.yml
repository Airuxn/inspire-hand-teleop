name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright type check
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Codecov upload via OIDC, no token secret
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries for headless Qt, OpenCV and MediaPipe
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libgles2 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Cache MediaPipe hand model
        uses: actions/cache@v4
        with:
          path: ~/.cache/inspire-hand-teleop/hand_landmarker.task
          key: mediapipe-hand-landmarker-float16-v1
      - run: uv sync --locked
      - name: Tests with coverage
        run: >-
          uv run pytest -q --cov --cov-report=term --cov-report=xml
          --cov-report=markdown-append:$GITHUB_STEP_SUMMARY
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false
