[project]
name = "inspire-hand-teleop"
version = "0.2.0"
description = "Real-time webcam teleoperation of the Inspire RH56 dexterous hand."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Michaël VH" }]
requires-python = ">=3.10"
keywords = [
    "robotics",
    "teleoperation",
    "dexterous-manipulation",
    "hand-tracking",
    "retargeting",
    "mediapipe",
    "inspire-hand",
    "modbus",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "mediapipe>=0.10.14",
    "pyserial>=3.5",
    "pyqtgraph>=0.13",
    "pyside6-essentials>=6.7",
]

[project.urls]
Repository = "https://github.com/Airuxn/inspire-hand-teleop"
Issues = "https://github.com/Airuxn/inspire-hand-teleop/issues"
Changelog = "https://github.com/Airuxn/inspire-hand-teleop/blob/main/CHANGELOG.md"

[project.scripts]
inspire-teleop = "inspire_teleop.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inspire_teleop"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["inspire_teleop"]
concurrency = ["thread"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.pyright]
include = ["inspire_teleop", "tests"]
pythonVersion = "3.10"
